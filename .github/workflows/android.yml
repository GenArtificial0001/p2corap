name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar debug
        id: build
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "## Fallo de compilación (exit $code)"
              echo ""
              echo "### Errores Kotlin"
              echo '```'
              grep -E "^e: " /tmp/build.log | head -60
              echo '```'
              echo ""
              echo "### What went wrong"
              echo '```'
              sed -n '/\* What went wrong/,/^\* Try:/p' /tmp/build.log | head -40
              echo '```'
              echo ""
              echo "### Últimas líneas"
              echo '```'
              tail -60 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # El log se publica en una rama para poder leerlo sin token.
      - name: Publicar log
        if: always()
        run: |
          mkdir -p ci
          cp /tmp/build.log ci/last-build.log 2>/dev/null || echo "(sin log)" > ci/last-build.log
          git config user.name "radar-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci/last-build.log
          git commit -m "ci: log del build ${GITHUB_RUN_ID}" || true
          git push -f origin ci-logs || true

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
